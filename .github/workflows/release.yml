name: Test and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: getgauge/setup-gauge@master
        with:
          gauge-version: '1.6.41'
      - run: |
          gauge install java --version 1.0.3
          gauge install html-report --version 4.4.7
      - run: mvn --batch-mode --no-transfer-progress clean test
      - name: Check generated template
        run: |
          ./scripts/package-template.sh "$RUNNER_TEMP/kotlin_maven.zip"
          mkdir "$RUNNER_TEMP/generated-project"
          cd "$RUNNER_TEMP/generated-project"
          gauge init "$RUNNER_TEMP/kotlin_maven.zip"
          mvn --batch-mode --no-transfer-progress clean test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Package template
        run: |
          test "v$(jq -r .version metadata.json)" = "$GITHUB_REF_NAME"
          ./scripts/package-template.sh "$RUNNER_TEMP/kotlin_maven.zip"
          cd "$RUNNER_TEMP"
          sha256sum kotlin_maven.zip > kotlin_maven.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/kotlin_maven.zip" "$RUNNER_TEMP/kotlin_maven.zip.sha256" --generate-notes
